[package]
name = "validate-commits"
version = "0.1.0"
edition = "2024"
description = "Run Nix flake checks for every commit in a revision range"
license = "MIT"
repository = "https://github.com/fungi-protocol/validate-commits"

[dependencies]
clap = { version = "4", features = ["derive"] }
gix = { version = "0.87.1", default-features = false, features = ["revision", "sha1"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3.23.0"
